[workspace]
resolver = "2"
members = [
  "crates/mnemo-cli",
  "crates/mnemo-core",
  "crates/mnemo-schema",
  "crates/mnemo-package",
  "crates/mnemo-security",
  "crates/mnemo-store",
  "crates/mnemo-testkit",
  "crates/adapters/common",
  "crates/adapters/claude-code",
  "crates/adapters/codex",
  "crates/adapters/qoder",
  "crates/adapters/cursor",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/muzishuiji/mnemoport"

[workspace.dependencies]
age = "0.12"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
ed25519-dalek = "3.0"
getrandom = "0.4"
hex = "0.4"
regex = "1.11"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signature = "3.0"
tar = "0.4"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
