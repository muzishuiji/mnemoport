name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Require release tag to match the workspace version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"

  build:
    name: build (${{ matrix.target }})
    needs: [validate]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mnemo
            archive: mnemoport-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mnemo
            archive: mnemoport-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mnemo.exe
            archive: mnemoport-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }} -p mnemo-cli
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/
          tar -C dist/package -czf "dist/${{ matrix.archive }}" "${{ matrix.binary }}"
          shasum -a 256 "dist/${{ matrix.archive }}" > "dist/${{ matrix.archive }}.sha256"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/package/${{ matrix.binary }}"
          Compress-Archive -Path "dist/package/${{ matrix.binary }}" -DestinationPath "dist/${{ matrix.archive }}"
          $digest = (Get-FileHash "dist/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$digest  ${{ matrix.archive }}" | Set-Content "dist/${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error

  sbom:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo +stable install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo +stable cyclonedx --manifest-path crates/mnemo-cli/Cargo.toml --format json --describe binaries --all-features --target all
      - name: Stage SBOM
        shell: bash
        run: |
          mkdir -p dist
          test -f crates/mnemo-cli/mnemo_bin.cdx.json
          cp crates/mnemo-cli/mnemo_bin.cdx.json dist/mnemoport.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-sbom
          path: dist/mnemoport.cdx.json
          if-no-files-found: error

  attest:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          sbom-path: artifacts/release-sbom/mnemoport.cdx.json

  publish:
    if: github.ref_type == 'tag'
    needs: [attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
